name: Bootstrap lockfile (temporary)

on:
  push:
    branches: [feat/bootstrap-ts-vite-ci]
    paths:
      - ".github/workflows/bootstrap-lockfile.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.repository == 'Jonamarti/humanoid-physics-lab' && github.ref == 'refs/heads/feat/bootstrap-ts-vite-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve dependency lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to feature branch
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: fijar dependencias transitivas en package-lock.json"
          git push origin HEAD:feat/bootstrap-ts-vite-ci
