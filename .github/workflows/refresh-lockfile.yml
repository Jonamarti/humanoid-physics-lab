name: Lockfile refresh (temporary)
on:
  push:
    branches: [feat/mujoco-wasm-runtime]
    paths:
      - ".github/workflows/refresh-lockfile.yml"
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Update feature branch lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet || git commit -m 'build: fijar MuJoCo WASM en package-lock.json'
          git push origin HEAD:feat/mujoco-wasm-runtime
