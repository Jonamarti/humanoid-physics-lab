name: Visual smoke editor 3D (temporary branch)

on:
  push:
    branches: [feat/force-editor-browser-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Dependencies and Chromium recording
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install ffmpeg
          command -v google-chrome || command -v chromium || npx playwright install chromium
      - name: Build
        run: npm run build
      - name: Serve static production build
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4173/humanoid-physics-lab/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Real Chromium UI test and record
        run: |
          node scripts/smoke-force-editor.mjs
          node scripts/smoke-force-editor-mobile.mjs
      - name: Upload screenshot, video and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hpl-multiforce-smoke
          path: editor-smoke-media/
          retention-days: 7
          if-no-files-found: warn
